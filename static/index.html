<!DOCTYPE html>
<html lang="en">
<head>
<script>try{if(localStorage.getItem("ic-theme")==="light")document.documentElement.dataset.theme="light";}catch(_){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070d14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/static/icons/icon-512.png">
<link rel="apple-touch-icon" href="/static/icons/icon-512.png">
<title>IPO Command Center</title>
<style>
:root{
  color-scheme:dark;
  --bg:#070d14; --card:#0f1824; --card2:#15212f; --line:#1e2d3e;
  --txt:#e9eff6; --mut:#8fa3b8;
  --acc:#14b8a6; --acc2:#2dd4bf; --gold:#e3b23c;
  --grn:#34d399; --red:#f87171; --amb:#fbbf24; --prp:#c4b5fd;
  --input:#0b1420; --hover:#131f2e;
  --info-bg:#0d2430; --info-line:#1d4356; --info-txt:#9fd8e8;
  --header-bg:rgba(11,18,26,.82);
  --bg-glow:radial-gradient(1200px 620px at 72% -12%,rgba(20,184,166,.075),transparent 62%);
  --r-sm:9px; --r:14px; --r-lg:18px;
  --sh-1:inset 0 1px 0 rgba(255,255,255,.028),0 1px 2px rgba(0,0,0,.34);
  --sh-2:0 6px 18px rgba(0,0,0,.32);
  --sh-3:0 18px 48px rgba(0,0,0,.5);
  --ring:0 0 0 3px rgba(20,184,166,.28);
  --ease:cubic-bezier(.2,.7,.3,1);
}
:root[data-theme=light]{
  color-scheme:light;
  --bg:#f2f6f7; --card:#ffffff; --card2:#eef3f4; --line:#dae3e8;
  --txt:#13212d; --mut:#5b7181;
  --acc:#0d9488; --acc2:#14b8a6; --gold:#a97e14;
  --grn:#0e9f6e; --red:#dc2626; --amb:#b45309; --prp:#7c3aed;
  --input:#f3f7f8; --hover:#eaf1f3;
  --info-bg:#e5f4f6; --info-line:#bfe3ea; --info-txt:#0f4c56;
  --header-bg:rgba(255,255,255,.86);
  --bg-glow:radial-gradient(1200px 620px at 72% -12%,rgba(13,148,136,.06),transparent 62%);
  --sh-1:inset 0 1px 0 rgba(255,255,255,.7),0 1px 2px rgba(16,42,58,.06);
  --sh-2:0 8px 24px rgba(16,42,58,.09);
  --sh-3:0 22px 50px rgba(16,42,58,.16);
  --ring:0 0 0 3px rgba(13,148,136,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);background-image:var(--bg-glow);background-attachment:fixed;color:var(--txt);
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:rgba(20,184,166,.32)}
::-webkit-scrollbar{height:10px;width:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--card2)}
header{padding:14px 22px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);
  background:var(--header-bg);backdrop-filter:blur(12px) saturate(1.3);-webkit-backdrop-filter:blur(12px) saturate(1.3);
  position:sticky;top:0;z-index:50;flex-wrap:wrap}
header h1{font-size:17px;font-weight:800;letter-spacing:-.2px}
header h1 span{background:linear-gradient(100deg,var(--gold),#f2cd6b);-webkit-background-clip:text;background-clip:text;color:transparent}
.bellbtn{position:relative;background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--txt);
  padding:7px 12px;cursor:pointer;font-size:15px;transition:border-color .16s var(--ease),transform .12s var(--ease)}
.bellbtn:hover{border-color:var(--acc)}
.bellbtn:active{transform:scale(.95)}
#bell-count{position:absolute;top:-7px;right:-7px;background:var(--red);color:#fff;border-radius:12px;font-size:10.5px;font-weight:700;padding:2px 6px;display:none}
#alert-drawer{position:fixed;top:64px;right:16px;width:380px;max-width:94vw;max-height:72vh;overflow:auto;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r-lg);z-index:90;display:none;box-shadow:var(--sh-3);padding:14px}
#alert-drawer.show{display:block}
.alert-row{border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-bottom:8px;background:var(--card2);font-size:12.5px;line-height:1.5}
.alert-row b{font-size:13px}
.sev-high{border-left:3px solid var(--red)}.sev-med{border-left:3px solid var(--amb)}.sev-info{border-left:3px solid var(--acc)}
.badge{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--mut);
  font-variant-numeric:tabular-nums;letter-spacing:.2px}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{background:none;border:1px solid transparent;color:var(--mut);padding:7px 14px;border-radius:11px;cursor:pointer;
  font-size:13.5px;font-weight:600;transition:color .16s var(--ease),background .16s var(--ease)}
nav button:hover{color:var(--txt)}
nav button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 2px 10px rgba(20,184,166,.32)}
nav button.dock-only{display:none}
main{padding:20px 22px;max-width:1500px;margin:0 auto}
main section{animation:rise .24s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--sh-1);
  position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--acc),var(--gold));opacity:.55}
.kpi[onclick]{cursor:pointer;transition:transform .18s var(--ease),border-color .18s var(--ease),box-shadow .18s var(--ease)}
.kpi[onclick]:hover{transform:translateY(-2px);border-color:rgba(20,184,166,.55);box-shadow:var(--sh-2)}
.kpi[onclick]:active{transform:translateY(0)}
.kpi[onclick]::after{content:'\203A';position:absolute;top:12px;right:15px;color:var(--mut);font-size:17px;line-height:1;
  transition:color .18s var(--ease),transform .18s var(--ease)}
.kpi[onclick]:hover::after{color:var(--acc);transform:translateX(2px)}
.kpi .l{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.9px;font-weight:700}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.3px;margin-top:6px;font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}
.kpi .s{font-size:12px;color:var(--mut);margin-top:4px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;margin-bottom:16px;box-shadow:var(--sh-1)}
.card h3{font-size:15px;font-weight:750;letter-spacing:-.1px;margin-bottom:12px;color:var(--txt)}
.card h3 small{color:var(--mut);font-weight:450}
table{width:100%;border-collapse:collapse}
th{color:var(--mut);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;text-align:left;
  padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:var(--hover)}
input,select,textarea{background:var(--input);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 11px;
  font-size:13px;font-family:inherit;transition:border-color .16s var(--ease),box-shadow .16s var(--ease)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:var(--ring)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc);cursor:pointer}
.btn{background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;color:#fff;border-radius:11px;padding:9px 16px;font-size:13px;
  font-weight:650;letter-spacing:.15px;cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 2px 8px rgba(20,184,166,.26);
  transition:filter .16s var(--ease),transform .12s var(--ease),box-shadow .16s var(--ease)}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.965)}
.btn:focus-visible{outline:none;box-shadow:var(--ring)}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:9px}
.btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--txt);box-shadow:none}
.btn.ghost:hover{border-color:rgba(20,184,166,.5)}
.btn.warn{background:linear-gradient(135deg,#d97706,#fbbf24);color:#241a02;box-shadow:0 1px 0 rgba(255,255,255,.15) inset,0 2px 8px rgba(245,158,11,.3)}
.btn.danger{background:transparent;border:1px solid rgba(248,113,113,.55);color:var(--red);box-shadow:none}
.btn.danger:hover{background:rgba(248,113,113,.08)}
.chip{display:inline-block;padding:3.5px 11px;border-radius:999px;font-size:11px;font-weight:750;letter-spacing:.45px;white-space:nowrap}
.c-open{background:#0d3a30;color:#5eead4}
.c-upcoming{background:#1a2b45;color:#93c5fd}
.c-result_pending{background:#3d2f10;color:#fcd34d}
.c-allotment_done{background:#2e2450;color:#c4b5fd}
.c-listed{background:#10382a;color:#6ee7b7}
.c-closed{background:#222b36;color:#93a5b8}
:root[data-theme=light] .c-open{background:#d6f4ee;color:#0f766e}
:root[data-theme=light] .c-upcoming{background:#e0e9f9;color:#1d4ed8}
:root[data-theme=light] .c-result_pending{background:#faedd3;color:#b45309}
:root[data-theme=light] .c-allotment_done{background:#eae6fb;color:#6d28d9}
:root[data-theme=light] .c-listed{background:#dcf5ea;color:#0e9f6e}
:root[data-theme=light] .c-closed{background:#e6ebef;color:#5b7181}
.tpill{flex:0 0 auto;display:flex;gap:9px;align-items:center;background:var(--input);border:1px solid var(--line);border-radius:var(--r);padding:9px 13px;cursor:pointer}
.tpill.neg{border-color:#5c2128}
.pos{color:var(--grn)}.neg{color:var(--red)}.mut{color:var(--mut)}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.modal-bg{position:fixed;inset:0;background:rgba(3,7,13,.7);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:none;z-index:100;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal-bg.show{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:20px;width:560px;max-width:96vw;padding:22px 24px;
  box-shadow:var(--sh-3);animation:popin .22s var(--ease)}
@keyframes popin{from{opacity:0;transform:scale(.965) translateY(6px)}to{opacity:1;transform:none}}
.modal h3{margin-bottom:14px;font-size:16px;font-weight:750;letter-spacing:-.1px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 14px}
.form-grid .full{grid-column:1/-1}
.field label{display:block;font-size:10.5px;font-weight:700;color:var(--mut);margin-bottom:5px;text-transform:uppercase;letter-spacing:.7px}
.field input,.field select,.field textarea{width:100%}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);
  border-radius:999px;padding:11px 20px;display:none;z-index:300;font-size:13.5px;font-weight:600;max-width:90vw;
  box-shadow:var(--sh-3);animation:toastin .28s var(--ease)}
@keyframes toastin{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.checkres{max-height:280px;overflow:auto;margin-top:10px}
.checkres div{padding:8px 11px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;font-size:12.5px;background:var(--card2);line-height:1.5}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar select{min-width:280px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.two{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}}
.info{background:var(--info-bg);border:1px solid var(--info-line);border-radius:13px;padding:11px 14px;font-size:12.5px;color:var(--info-txt);margin-bottom:14px;line-height:1.55}
a{color:var(--acc2)}
.pbar{height:7px;background:var(--line);border-radius:6px;overflow:hidden}
.pbar div{height:100%;background:linear-gradient(90deg,var(--acc),var(--gold));border-radius:6px;transition:width .4s var(--ease)}
.acctable td.stick,.acctable th.stick{position:sticky;background:var(--card)}
.acctable td.c1,.acctable th.c1{left:0;min-width:32px;width:32px;text-align:center}
.acctable td.c2,.acctable th.c2{left:32px;min-width:108px}
.acctable th.stick{z-index:4}
.acctable tr:hover td.stick{background:var(--card)!important}
/* accounts rows: same comfortable size as the applications tab, and the table
   slides sideways like it (sticky # + Applicant columns stay pinned) */
.acctable{min-width:720px}
.acctable td{white-space:nowrap}
/* accounts action buttons always stay in one horizontal line */
.acctable .row-actions{flex-wrap:nowrap}
/* applications tab: applicant column stays fixed while the rest slides */
.apptable td.stick,.apptable th.stick{position:sticky;left:0;background:var(--card);min-width:118px;box-shadow:2px 0 0 var(--line);z-index:3}
.apptable th.stick{z-index:5}
.apptable tr:hover td.stick{background:var(--card)!important}
h2.sec{font-size:15px;font-weight:750;letter-spacing:-.1px;margin:22px 0 10px;color:var(--txt)}
select.mini,input.mini{padding:5px 8px;font-size:12px;border-radius:8px}
input.upi-diff{border-color:var(--amb)!important;background:rgba(245,158,11,.22)!important}
td.upi-def{white-space:nowrap}
input.num{text-align:right;width:90px;font-variant-numeric:tabular-nums}
input.wide{width:150px}
/* boot splash — covers the free-host cold start with a branded moment */
#boot{position:fixed;inset:0;background:var(--bg);background-image:var(--bg-glow);z-index:500;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;transition:opacity .45s var(--ease)}
#boot.gone{opacity:0;pointer-events:none}
#boot .boot-mark{width:66px;height:66px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:32px;
  background:linear-gradient(140deg,rgba(20,184,166,.28),rgba(227,178,60,.14));border:1px solid rgba(20,184,166,.45);
  box-shadow:0 0 0 6px rgba(20,184,166,.07),var(--sh-2);animation:bootpulse 1.6s var(--ease) infinite}
@keyframes bootpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#boot .boot-title{font-size:19px;font-weight:800;letter-spacing:-.2px}
#boot .boot-title span{background:linear-gradient(100deg,var(--gold),#f2cd6b);-webkit-background-clip:text;background-clip:text;color:transparent}
#boot .boot-spin{width:24px;height:24px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);animation:bootrot .8s linear infinite}
@keyframes bootrot{to{transform:rotate(360deg)}}
#boot .boot-sub{color:var(--mut);font-size:12.5px;text-align:center;line-height:1.6}
@media(max-width:720px){
  header{padding:10px 12px;gap:7px}
  header h1{font-size:15px}
  .badge{font-size:11px;padding:3px 9px}
  nav{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
  nav button{padding:7px 10px;font-size:12.5px;white-space:nowrap}
  main{padding:12px 10px}
  th,td{font-size:12px;padding:6px 7px}
  .kpi .v{font-size:20px}
  .card{padding:14px}
  .modal{padding:16px;width:100%}
  .form-grid{grid-template-columns:1fr}
  #alert-drawer{top:auto;bottom:0;left:0;right:0;width:100%;max-width:100%;border-radius:18px 18px 0 0;max-height:78vh}
  input.wide{width:112px}
  .toolbar select{min-width:100%}
  .btn{padding:10px 15px}
}
@media (max-width:720px), (pointer:coarse){
  nav{position:fixed;left:0;right:0;bottom:0;background:var(--header-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-top:1px solid var(--line);display:flex;gap:0;margin:0;padding:3px 2px calc(3px + env(safe-area-inset-bottom));z-index:95;
    box-shadow:0 -8px 24px rgba(0,0,0,.32)}
  nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;padding:7px 2px;color:var(--mut);
    border:none;border-radius:11px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav button.dock-only{display:flex}
  nav button::before{content:attr(data-ic);font-size:18px;line-height:1.15}
  nav button.on{background:rgba(20,184,166,.13);color:var(--acc2);box-shadow:none}
}
main{padding-bottom:8px}
@media (max-width:720px), (pointer:coarse){main{padding-bottom:86px}}
@media (max-width:720px), (pointer:coarse){#toast{bottom:96px;max-width:92vw}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="boot" role="status">
  <div class="boot-mark">📈</div>
  <div class="boot-title">IPO <span>Command Center</span></div>
  <div class="boot-spin"></div>
  <div class="boot-sub">Waking up the server…<br>first open can take up to 30 s</div>
</div>
<header>
  <h1>📈 IPO <span>Command Center</span></h1>
  <span class="badge" id="hdr-counts">…</span>
  <span class="mut" id="hdr-backup" style="font-size:11px;align-self:center" title="Time (IST) your changes last became safely backed up — watch it move after every tap">💾 —</span>
  <button class="bellbtn" id="bell" onclick="toggleAlerts()" title="Alerts & reminders">🔔<span id="bell-count"></span></button>
  <nav>
    <button data-tab="dash" class="on" data-ic="🏠">Dashboard</button>
    <button data-tab="ipos" data-ic="📋">IPOs</button>
    <button data-tab="apps" data-ic="✅">Applications</button>
    <button data-tab="market" data-ic="💹">Market</button>
    <button data-tab="accounts" data-ic="👥">Accounts</button>
    <button data-tab="pnl" data-ic="💰">P&amp;L</button>
    <button class="dock-only" data-ic="🌓" onclick="toggleTheme()" title="Switch dark / light">Theme</button>
    <button class="dock-only" data-ic="🚪" onclick="logout()" title="Log out on this device">Logout</button>
  </nav>
  <button class="bellbtn themebtn" id="themebtn" onclick="toggleTheme()" title="Switch dark / light">☀️</button>
  <button class="bellbtn" onclick="logout()" title="Log out on this device"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" style="vertical-align:-3.5px"><path d="M12 2.5v10"/><path d="M18.7 6.4a8.3 8.3 0 1 1-13.4 0"/></svg></button>
</header>
<main>
  <section id="tab-dash"></section>
  <section id="tab-ipos" style="display:none"></section>
  <section id="tab-market" style="display:none"></section>
  <section id="tab-apps" style="display:none"></section>
  <section id="tab-accounts" style="display:none"></section>
  <section id="tab-pnl" style="display:none"></section>
</main>

<div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>
<div id="alert-drawer">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <b>Alerts & reminders</b>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn sm ghost" id="notif-btn" onclick="enableNotifs()">🔔 Enable phone alerts</button>
      <button class="btn sm ghost" onclick="toggleAlerts()">✕</button>
    </div>
  </div>
  <div class="mut" style="font-size:11px;margin-bottom:8px" id="alert-ts"></div>
  <div id="alert-list"></div>
  <div style="border-top:1px solid var(--line);margin-top:12px;padding-top:10px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b style="font-size:12.5px">🔔 Notification switches</b>
      <span class="mut" style="font-size:10.5px">saved on server • applies to all your devices</span>
    </div>
    <div id="notif-prefs" class="mut" style="font-size:12px;padding-top:6px">loading…</div>
  </div>
</div>
<div id="toast"></div>

<script>
let S={accounts:[],ipos:[],applications:[],today:''};
let applyCheckMode=false;
let curTab='dash', selIpo=null;

// ---------- utils ----------
const api=async(u,m='GET',b)=>{const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
  if(r.status===401){location.href='/';throw new Error('locked');}
  const j=await r.json().catch(()=>({})); if(!r.ok){toast(j.detail||j.error||'Error',1); throw new Error(j.detail||'err');} return j;};
const rs=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:0});
const num=n=>(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const kr=n=>{n=Number(n)||0;if(Math.abs(n)>=1e7)return '₹'+(n/1e7).toFixed(2)+' Cr';if(Math.abs(n)>=1e5)return '₹'+(n/1e5).toFixed(2)+' L';return rs(n);};
const pnlCls=n=>n>0?'pos':(n<0?'neg':'mut');
const pnlTxt=n=>(n>0?'+':'')+kr(n);
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fd=d=>{if(!d)return'—';const[y,m,dd]=d.split('-');return `${+dd} ${MONTHS[+m-1]}`;};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// esc + JS-string escaping — for names dropped inside single-quoted onclick args
const jsq=s=>esc(String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"));
let toastTm=null;
function toast(msg,bad){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';
  t.style.borderColor=bad?'var(--red)':'var(--grn)';clearTimeout(toastTm);toastTm=setTimeout(()=>t.style.display='none',3200);}
const ipoById=id=>S.ipos.find(x=>x.id===+id);
const accById=id=>S.accounts.find(x=>x.id===+id);
const appFor=(ipo,acc)=>S.applications.find(a=>a.ipo_id===+ipo&&a.account_id===+acc);
const costPerShare=a=>{const b=(a.allotted_qty>0?a.allotted_qty:0)||(a.sell_qty||0);return b>0?a.amount/b:0;};
const bookedPnl=a=>a.allotment==='allotted'&&a.sell_qty>0?(a.sell_price-costPerShare(a))*a.sell_qty:0;
const unrealPnl=(a,ipo)=>a.allotment==='allotted'?( (ipo.cmp||0)-costPerShare(a) )*Math.max(0,a.allotted_qty-a.sell_qty):0;

async function refresh(){S=await api('/api/state');
  document.getElementById('hdr-counts').textContent=`${S.accounts.filter(a=>a.active).length} accounts • ${S.ipos.filter(i=>i.status==='open').length} IPOs open`;
  const hb=document.getElementById('hdr-backup');if(hb)hb.textContent=S.backup_at?('💾 saved '+S.backup_at.slice(11,16)):'💾 —';
  render();}
// After a one-tap write: (1) if the reload fails (network blip), SAY SO — a
// stale screen must never look like "the save didn't happen"; (2) PROVE the
// server kept the write (verify-after-write) — even a failure mode we have
// not imagined yet surfaces as a loud ⚠, never silent wrong numbers.
const refreshHard=(check)=>refresh().then(()=>{
  if(check&&!check())toast('⚠ Server did not keep that change — tap it again; if it repeats, tell me.',1);
}).catch(()=>toast('Saved on server ✓ — but screen reload failed. Close & reopen to see the latest.',1));

  document.querySelectorAll('main section').forEach(s=>s.style.display='none');

// ---------- DASHBOARD ----------
function renderDash(){
  const el=document.getElementById('tab-dash');
  const apps=S.applications.filter(a=>a.applied);
  const blocked=apps.filter(a=>a.mandate_status==='approved'&&a.allotment!=='allotted'&&a.refund!=='received'&&!(a.sell_qty>0)).reduce((s,a)=>s+a.amount,0);
  const awaitingRefund=apps.filter(a=>a.allotment==='not_allotted'&&a.refund==='pending').reduce((s,a)=>s+a.amount,0);
  const debited=apps.filter(a=>a.allotment==='allotted').reduce((s,a)=>s+a.amount,0);
  const soldBack=apps.filter(a=>a.allotment==='allotted').reduce((s,a)=>s+(a.sell_qty||0)*(a.sell_price||0),0);
  const mandPend=apps.filter(a=>a.mandate_status==='pending');
  const booked=apps.reduce((s,a)=>s+bookedPnl(a),0);
  const unreal=apps.reduce((s,a)=>s+unrealPnl(a,ipoById(a.ipo_id)||{cmp:0}),0);
  const openIpos=S.ipos.filter(i=>i.status==='open');

  // action items
  const acts=[];
  mandPend.forEach(a=>{const i=ipoById(a.ipo_id),ac=accById(a.account_id);if(i&&i.status!=='listed')
    acts.push({t:'UPI mandate pending',d:`${esc(ac?ac.holder:'?')} — <b>${esc(i.name)}</b> • ${rs(a.amount)} ${a.upi?`• UPI: <code>${esc(a.upi)}</code>`:''}`,cls:'neg'});});
  apps.filter(a=>a.allotment==='not_allotted'&&a.refund==='pending').forEach(a=>{const i=ipoById(a.ipo_id),ac=accById(a.account_id);
    acts.push({t:'Refund / unblock pending',d:`${esc(ac?ac.holder:'?')} — <b>${esc(i?i.name:'?')}</b> • ${rs(a.amount)}`,cls:''});});
  S.ipos.forEach(i=>{
    if(i.allotment_date&&i.status==='result_pending'&&i.allotment_date<=S.today)
      acts.push({t:'Allotment day — run auto-check',d:`<b>${esc(i.name)}</b> (${esc(i.registrar)})`,act:`goApps(${i.id},1)`});
    if(i.listing_date===S.today)acts.push({t:'Lists today 🔔',d:`<b>${esc(i.name)}</b> — set CMP in IPO edit, record sells in Applications`,act:`goApps(${i.id})`});
  });
  openIpos.forEach(i=>{const applied=S.applications.filter(a=>a.ipo_id===i.id&&a.applied).length;
    const total=S.accounts.filter(a=>a.active).length;
    if(applied<total)acts.push({t:'Not all accounts applied',d:`<b>${esc(i.name)}</b> — applied ${applied}/${total} (closes ${fd(i.close_date)})`,act:`goApps(${i.id})`});});

  // 📌 TODAY strip — one-glance, time-critical items with tap-to-open
  const pills=[];
  S.ipos.filter(i=>i.status==='open'&&i.close_date===S.today).forEach(i=>
    pills.push({ic:'⏰',t:`<b>${esc(i.name)}</b> closes today`,s:`GMP ₹${num(i.gmp||0)} • apply by ~1 PM`,cls:'neg',act:`goApps(${i.id})`}));
  S.ipos.filter(i=>i.open_date===S.today&&i.status==='upcoming').forEach(i=>
    pills.push({ic:'🚀',t:`<b>${esc(i.name)}</b> opens today`,s:i.gmp?`GMP ₹${num(i.gmp)}`:'',act:`goApps(${i.id})`}));
  S.ipos.filter(i=>i.allotment_date&&i.status==='result_pending'&&i.allotment_date<=S.today).forEach(i=>
    pills.push({ic:'🎯',t:`<b>${esc(i.name)}</b> allotment due`,s:'tap to auto-check',act:`goApps(${i.id},1)`}));
  S.ipos.filter(i=>i.listing_date===S.today).forEach(i=>{
    const sh=S.applications.filter(a=>a.ipo_id===i.id&&a.allotment==='allotted').reduce((s,a)=>s+(a.allotted_qty||0),0);
    pills.push({ic:'🔔',t:`<b>${esc(i.name)}</b> lists today`,s:sh?`${sh} sh held${i.cmp?` • CMP ₹${num(i.cmp)}`:''}`:(i.gmp?`last GMP ₹${num(i.gmp)}`:''),act:`goApps(${i.id})`});});
  const rfp=apps.filter(a=>a.allotment==='not_allotted'&&a.refund==='pending');
  if(rfp.length)pills.push({ic:'🔓',t:`${rfp.length} refunds pending`,s:kr(rfp.reduce((s,a)=>s+a.amount,0))+' to unblock',act:`goApps(${rfp[0].ipo_id})`});
  const mp=apps.filter(a=>a.mandate_status==='pending'&&(ipoById(a.ipo_id)||{}).status==='open');
  if(mp.length)pills.push({ic:'⏳',t:`${mp.length} UPI mandates waiting`,s:'approve on the phones — tap to open',cls:'neg',act:`goApps(${mp[0].ipo_id})`});
  const todayStrip=pills.length?`<div class="mut" style="font-size:11.5px;font-weight:700;letter-spacing:.6px;margin:4px 0 6px">📌 TODAY</div>
    <div style="display:flex;gap:8px;overflow-x:auto;padding:0 0 10px;-webkit-overflow-scrolling:touch">${
    pills.map(p=>`<div class="tpill ${p.cls||''}" ${p.act?`onclick="${p.act}"`:''}><span style="font-size:20px">${p.ic}</span><span><div style="font-size:13px;font-weight:600;white-space:nowrap">${p.t}</div><div class="mut" style="font-size:11px;white-space:nowrap">${p.s}</div></span></div>`).join('')}</div>`:'';

  el.innerHTML=`
  <div class="info">💡 Allotment is <b>PAN-based</b> — keep one unique PAN per account or exchanges reject duplicate bids. This app never asks for your demat/broker passwords; allotment checks use only PAN / CDSL BO ID (public registrar data). <b>Tap any summary box below for its full break-up.</b></div>
  ${todayStrip}
  <div class="grid-kpi">
    <div class="kpi" onclick="dashDrill('open')" title="Tap for the list"><div class="l">IPOs open now</div><div class="v">${openIpos.length}</div><div class="s">${S.ipos.filter(i=>i.status==='upcoming').length} upcoming • tap for details</div></div>
    <div class="kpi" onclick="dashDrill('blocked')" title="Tap for the break-up"><div class="l">Capital blocked</div><div class="v">${kr(blocked)}</div><div class="s">money still blocked in UPI — excludes debited (allotted), unblocked & sold-back amounts</div></div>
    <div class="kpi" onclick="dashDrill('debit')" title="Tap for the break-up"><div class="l">Amount debited (allotted)</div><div class="v">${kr(debited)}</div><div class="s">${kr(soldBack)} recovered via sales so far</div></div>
    <div class="kpi" onclick="dashDrill('refund')" title="Tap for the list"><div class="l">Refunds pending</div><div class="v" style="color:var(--amb)">${kr(awaitingRefund)}</div><div class="s">not allotted, unblock awaited</div></div>
    <div class="kpi" onclick="dashDrill('mandate')" title="Tap for the list"><div class="l">Mandates to approve</div><div class="v" style="color:${mandPend.length?'var(--red)':'var(--grn)'}">${mandPend.length}</div><div class="s">UPI requests waiting</div></div>
    <div class="kpi" onclick="dashDrill('booked')" title="Tap for the break-up"><div class="l">Booked profit</div><div class="v ${pnlCls(booked)}">${pnlTxt(booked)}</div><div class="s">from sold allotments</div></div>
    <div class="kpi" onclick="dashDrill('unreal')" title="Tap for the break-up"><div class="l">Unrealized P&L</div><div class="v ${pnlCls(unreal)}">${pnlTxt(unreal)}</div><div class="s">open allotment positions at CMP</div></div>
  </div>
  <div class="two">
    <div class="card"><h3>⚡ Needs your action <small>(${acts.length})</small></h3>
      ${acts.length?acts.map(a=>`<div style="padding:7px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center">
        <div><span class="${a.cls||''}" style="font-weight:600">${a.t}</span><br><span class="mut">${a.d}</span></div>
        ${a.act?`<button class="btn sm ghost" onclick="${a.act}">Open</button>`:''}</div>`).join('')
      :'<div class="mut">All clear 🎉</div>'}
    </div>
    <div class="card"><h3>🟢 Open / upcoming mainboard IPOs</h3>

window.restoreBackup=async(inp)=>{
  const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  if(!confirm('Restore this backup? It REPLACES all data currently in the app.'))return;
  let j;try{j=JSON.parse(await f.text());}catch(e){alert('That file is not a valid backup.');return;}
  try{
    const r=await fetch('/api/backup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(j)});
    const d=await r.json();
    if(r.ok&&d.ok){alert('✅ Restored: '+d.counts.accounts+' accounts, '+d.counts.ipos+' IPOs, '+d.counts.applications+' applications');location.reload();}
    else alert('Restore failed: '+(d.detail||d.error||('HTTP '+r.status)));
  }catch(e){alert('Restore failed: '+e.message);}
};
window.changePass=async()=>{
  const cur=document.getElementById('pc-cur').value.trim(),nw=document.getElementById('pc-new').value.trim(),nw2=document.getElementById('pc-new2').value.trim();
  if(!/^\d{6}$/.test(cur)||!/^\d{6}$/.test(nw))return toast('Both must be 6-digit numbers',1);
  if(nw!==nw2)return toast('The two new passcodes do not match — retype them carefully',1);
  if(nw===cur)return toast('New passcode is the same as the current one',1);
  await api('/api/passcode','POST',{current:cur,new:nw});
  toast('✅ Passcode changed & saved — this phone stays logged in, other devices will need the new code');
  document.getElementById('pc-cur').value='';document.getElementById('pc-new').value='';document.getElementById('pc-new2').value='';};

window.dashDrill=(kind)=>{
  const apps=S.applications.filter(a=>a.applied);
  const rowApp=(a,sub)=>{const i=ipoById(a.ipo_id)||{},ac=accById(a.account_id)||{};
    return `<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);align-items:center">
      <div><b>${esc(ac.holder||'?')}</b> — ${esc(i.name||'?')}<br>
      <span class="mut" style="font-size:11.5px">${sub||''}${rs(a.amount)}${a.upi?` • <code>${esc(a.upi)}</code>`:''}</span></div>
      ${i.id?`<button class="btn sm ghost" onclick="closeModal();goApps(${i.id})">Open</button>`:''}</div>`;};
  let title='',body='',foot='';
  if(kind==='open'){
    title='🟢 IPOs open & upcoming';
    const mk=i=>{const n=S.applications.filter(x=>x.ipo_id===i.id&&x.applied).length;
      return `<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);align-items:center">
        <div><b>${esc(i.name)}</b> ${i.gmp?`<span class="chip c-listed">GMP ₹${num(i.gmp)}</span>`:''}<br>
        <span class="mut" style="font-size:11.5px">${fd(i.open_date)} → closes ${fd(i.close_date)} • applied ${n}/${S.accounts.filter(a=>a.active).length} accounts</span></div>
        <button class="btn sm" onclick="closeModal();goApps(${i.id})">Apply / track</button></div>`;};
    const openL=S.ipos.filter(i=>i.status==='open'),upc=S.ipos.filter(i=>i.status==='upcoming');
    body=(openL.map(mk).join('')||'<div class="mut">Nothing open right now.</div>')
       +(upc.length?`<div class="mut" style="font-weight:700;margin:12px 0 4px;font-size:12px">UPCOMING</div>`+upc.map(mk).join(''):'');
  }else if(kind==='blocked'){
    const rows=apps.filter(a=>a.mandate_status==='approved'&&a.allotment!=='allotted'&&a.refund!=='received'&&!(a.sell_qty>0));
    const tot=rows.reduce((s,a)=>s+a.amount,0);
    title=`💸 Capital blocked — ${kr(tot)}`;
    foot='Not counted: allotted (debited = invested), unblocked (refund received) and fully/ partly sold amounts.';
    body=rows.map(a=>{const i=ipoById(a.ipo_id)||{};
      const st=a.allotment==='not_allotted'?'not allotted — refund awaited':'mandate approved — result awaited';
      const warn=(i.status==='listed')?'⚠️ IPO already listed — mark the real result in Applications • ':'';
      return rowApp(a,warn+st+' • ');}).join('')||'<div class="mut">Nothing blocked right now 🎉</div>';
  }else if(kind==='debit'){
    const rows=apps.filter(a=>a.allotment==='allotted');
    const tot=rows.reduce((s,a)=>s+a.amount,0),rb=rows.reduce((s,a)=>s+(a.sell_qty||0)*(a.sell_price||0),0);
    title=`🏦 Debited on allotment — ${kr(tot)}`;
    foot=`Across ${rows.length} allotment(s) • recovered via recorded sales: ${kr(rb)} • still out in unsold shares: ${kr(Math.max(0,tot-rb))} (at issue price)`;
    body=rows.map(a=>{const back=(a.sell_qty||0)*(a.sell_price||0);
      return rowApp(a,back?`back via sales ${rs(back)} • `:'unsold yet • ');}).join('')
      ||'<div class="mut">No debits yet — nothing allotted so far.</div>';
  }else if(kind==='refund'){
    const rows=apps.filter(a=>a.allotment==='not_allotted'&&a.refund==='pending');
    const tot=rows.reduce((s,a)=>s+(a.amount||0),0);
    title=`💳 Refunds pending — ${kr(tot)}`;
    foot='Bank-side unblocks land 1–2 days after non-allotment. When money hits the bank: open the IPO → tap "🔓 All funds unblocked".';
    body=rows.map(a=>rowApp(a,'unblock awaited • ')).join('')||'<div class="mut">No pending refunds 🎉</div>';
  }else if(kind==='mandate'){
    const rows=apps.filter(a=>a.mandate_status==='pending');
    const tot=rows.reduce((s,a)=>s+(a.amount||0),0);
    title=`⏳ Mandates to approve — ${rows.length} (${kr(tot)})`;
    foot='Approve the UPI collect requests on each phone before the issue closes.';
    body=rows.map(a=>rowApp(a,'waiting for UPI approval • ')).join('')||'<div class="mut">No mandates waiting 🎉</div>';
  }else if(kind==='booked'){
    const byI={};apps.forEach(a=>{const b=bookedPnl(a);if(!b)return;const i=ipoById(a.ipo_id)||{name:'?'};
      (byI[a.ipo_id]=byI[a.ipo_id]||{n:i.name,v:0,id:a.ipo_id}).v+=b;});
    const keys=Object.keys(byI).sort((x,y)=>byI[y].v-byI[x].v);
    const tot=keys.reduce((s,k)=>s+byI[k].v,0);
    title=`💰 Booked profit — ${pnlTxt(tot)}`;
    foot='Profit locked in from shares actually sold (sell qty × price in Applications).';
    body=keys.map(k=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);align-items:center">
      <b>${esc(byI[k].n)}</b>
      <span style="display:flex;align-items:center;gap:8px"><span class="${pnlCls(byI[k].v)}" style="font-weight:700">${pnlTxt(byI[k].v)}</span>
      <button class="btn sm ghost" onclick="closeModal();goApps(${byI[k].id})">Open</button></span></div>`).join('')
      ||'<div class="mut">Nothing sold yet.</div>';
  }else if(kind==='unreal'){
    const rows=apps.filter(a=>a.allotment==='allotted'&&(a.allotted_qty||0)>(a.sell_qty||0));
    const tot=rows.reduce((s,a)=>s+unrealPnl(a,ipoById(a.ipo_id)||{cmp:0}),0);
    title=`📈 Unrealized P&L — ${pnlTxt(tot)}`;
    foot='Shares still held, valued at CMP. To refresh CMP: IPOs tab → Edit → set CMP (or it auto-updates near listing).';
    body=rows.map(a=>{const i=ipoById(a.ipo_id)||{},ac=accById(a.account_id)||{};
      const oq=(a.allotted_qty||0)-(a.sell_qty||0),u=unrealPnl(a,i);
      return `<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);align-items:center">
      <div><b>${esc(ac.holder||'?')}</b> — ${esc(i.name||'?')}<br>
      <span class="mut" style="font-size:11.5px">${oq} sh open ${i.cmp?`@ CMP ₹${num(i.cmp)}`:'• CMP not set'}</span></div>
      <span class="${pnlCls(u)}" style="font-weight:700">${i.cmp?pnlTxt(u):'—'}</span></div>`;}).join('')
      ||'<div class="mut">No open positions — everything allotted is sold.</div>';
  }else{return;}
  openModal(`<h3>${title}</h3><div style="max-height:62vh;overflow:auto">${body}</div>
    ${foot?`<div class="mut" style="font-size:11.5px;margin-top:10px;line-height:1.5">${foot}</div>`:''}
    <div class="foot"><button class="btn ghost" onclick="closeModal()">Close</button></div>`);
};

async function collectRow(tr){

  return {ipo_id:selIpo,account_id:+tr.dataset.acc,applied:gc('.f-applied')?1:0,

    mandate_status:gv('.f-mandate'),allotment:gv('.f-allot'),allotted_qty:+gv('.f-aqty')||0,
    refund:gv('.f-refund'),sell_qty:+gv('.f-sqty')||0,sell_price:+gv('.f-sprice')||0};

async function saveRow(tr){
  const b=await collectRow(tr);
  // if amount empty & applied → let server auto-compute from lots
  if(!b.amount)delete b.amount;
  await api('/api/applications','POST',b);
  S=await api('/api/state');
  // lightly update row styling without full re-render jump
  if(b.applied&&!tr.querySelector('.f-lots').value)tr.querySelector('.f-lots').value=1;
  tr.querySelectorAll('input,select').forEach(x=>{if(!x.classList.contains('f-applied'))x.disabled=!b.applied;});
  const upiInp=tr.querySelector('.f-upi');
  if(upiInp)upiInp.classList.toggle('upi-diff',!!(upiInp.dataset.def&&upiInp.value.trim()&&upiInp.value.trim()!==upiInp.dataset.def));
  const ap=appFor(selIpo,b.account_id)||{},ipo=ipoById(selIpo);
  const profit=bookedPnl(ap)+unrealPnl(ap,ipo);
  const cell=tr.querySelector('.f-pnl');
  cell.className=pnlCls(profit);
  cell.innerHTML=ap.allotment==='allotted'?pnlTxt(profit):'<span class="mut">—</span>';
  toast('Saved');
}

function _bufToB64(b){return btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
window.fpRegister=async()=>{
  if(!('credentials' in navigator)||!window.PublicKeyCredential)return toast('This browser does not support biometrics',1);
  const o=await api('/api/webauthn/register/options','POST',{});
  let cred;
  try{
    cred=await navigator.credentials.create({publicKey:{
      challenge:_b64u8(o.challenge),rp:o.rp,
      user:{id:_b64u8(o.user.id),name:o.user.name,displayName:o.user.displayName},
      pubKeyCredParams:o.pubKeyCredParams,timeout:o.timeout,
      authenticatorSelection:o.authenticatorSelection}});
  }catch(e){return toast('Fingerprint prompt cancelled — tap the button again to retry',1);}
  if(!cred)return toast('Fingerprint prompt cancelled — tap the button again to retry',1);
  const v=await api('/api/webauthn/register/verify','POST',{id:cred.id,
    clientDataJSON:_bufToB64(cred.response.clientDataJSON),
    attestationObject:_bufToB64(cred.response.attestationObject)});
  // if the server rejects it, api() already shows the exact reason
  if(v&&v.ok)toast('👆 Fingerprint unlock enabled on this phone ✅');
};

  const btn=document.getElementById('chkbtn');btn.disabled=true;btn.textContent='Checking…';
  const box=document.getElementById('checkres');box.style.display='block';
  box.innerHTML='<div class="mut">Querying '+esc(ipoById(selIpo).registrar)+' for every account… (5–20 sec)</div>';
  try{
    const r=await api(`/api/ipos/${selIpo}/check_allotment`,'POST');
    box.innerHTML=r.results.map(x=>{
      const col=x.status==='ok'?'var(--grn)':(x.status==='not_found'?'var(--amb)':'var(--mut)');
      const lbl=x.status==='ok'?`✅ Allotted ${x.allotted_qty||''} sh`:(x.status==='not_found'?'❌ No allotment record':(x.status==='manual'?'🖐 Check manually':'⚠ '+x.status));
      return `<div><b>${esc(x.holder)}</b> — <span style="color:${col};font-weight:650">${lbl}</span>
        ${x.note?`<br><span class="mut">${esc(x.note)}</span>`:''}
        ${x.matched_company?`<br><span class="mut">matched: ${esc(x.matched_company)}</span>`:''}
        ${x.link?`<br><a href="${esc(x.link)}" target="_blank" rel="noopener">Open registrar →</a>`:''}</div>`;}).join('');
    toast('Allotment check complete');
  }catch(e){box.innerHTML='<div class="neg">Check failed: '+esc(e.message)+'</div>';}
  btn.disabled=false;btn.textContent='🔍 Auto-check allotment ('+ipoById(selIpo).registrar+')';
  refreshHard();};

// ---------- P&L ----------
function renderPnl(){
  const el=document.getElementById('tab-pnl');
  const apps=S.applications.filter(a=>a.applied&&a.allotment==='allotted');
  let tInv=0,tBook=0,tOpen=0,tUnreal=0;
  const rowsH=apps.map(a=>{
    const ipo=ipoById(a.ipo_id)||{},acc=accById(a.account_id)||{};
    const cost=costPerShare(a),inv=a.amount,book=bookedPnl(a),unrl=unrealPnl(a,ipo);
    const openQty=Math.max(0,a.allotted_qty-a.sell_qty),openVal=openQty*(ipo.cmp||0);
    tInv+=inv;tBook+=book;tOpen+=openVal;tUnreal+=unrl;
    return `<tr>
    <td><b>${esc(ipo.name||'?')}</b><br><span class="mut" style="font-size:11px">${fd(ipo.listing_date)}${ipo.symbol?' • '+esc(ipo.symbol):''}</span></td>
    <td>${esc(acc.holder||'?')}</td>
    <td>${num(a.allotted_qty)}</td><td>₹${num(cost)}</td><td>${rs(inv)}</td>
    <td>${ipo.cmp?'₹'+num(ipo.cmp):'<span class="mut">set CMP</span>'}</td>
    <td>${a.sell_qty?num(a.sell_qty)+' @ ₹'+num(a.sell_price):'—'}</td>
    <td class="${pnlCls(book)}">${a.sell_qty?pnlTxt(book):'—'}</td>
    <td>${openQty?num(openQty)+' sh ('+kr(openVal)+')':'—'}</td>
    <td class="${pnlCls(unrl)}">${openQty?(ipo.cmp?pnlTxt(unrl):'<span class="mut">set CMP</span>'):'—'}</td>
    <td class="${pnlCls(book+unrl)}" style="font-weight:700">${pnlTxt(book+unrl)}</td>
    </tr>`;}).join('');
  // ---- month-to-month & year-to-year profits (booked minus charges) ----
  const chargeItems=(S.charges&&S.charges.items)||[], chargeTpls=(S.charges&&S.charges.templates)||[];
  const mAgg={};
  const addM=(m,b,c)=>{if(!m||!/^\d{4}-\d{2}$/.test(m))return;const o=mAgg[m]||(mAgg[m]={b:0,c:0});o.b+=b||0;o.c+=c||0;};
  apps.forEach(a=>{if(!(a.sell_qty>0))return;const ipo=ipoById(a.ipo_id)||{};
    addM(((a.sold_on||ipo.listing_date||'')+'').slice(0,7),bookedPnl(a),0);});
  chargeItems.forEach(x=>addM(((x.date||'')+'').slice(0,7),0,+x.amount||0));
  const mKeys=Object.keys(mAgg).sort().reverse();
  const fyOf=m=>{const y=+m.slice(0,4),mm=+m.slice(5,7),s=mm>=4?y:y-1;return `FY ${s}-${String((s+1)%100).padStart(2,'0')}`;};
  const mLab=m=>{const[y,mm]=m.split('-');return new Date(+y,+mm-1,1).toLocaleString('en-IN',{month:'short',year:'numeric'});};
  const fold=(keyFn)=>{const p={};mKeys.forEach(m=>{const k=keyFn(m),o=p[k]||(p[k]={b:0,c:0});o.b+=mAgg[m].b;o.c+=mAgg[m].c;});return p;};
  const fyAgg=fold(fyOf), cyAgg=fold(m=>m.slice(0,4));
  const periodRows=(pool,labFn)=>{const ks=Object.keys(pool).sort().reverse();
    if(!ks.length)return '<tr><td colspan="4" class="mut">Nothing here yet — rows appear after your first sale / first charge.</td></tr>';
    let tB=0,tC=0;
    const body=ks.map(k=>{const o=pool[k];tB+=o.b;tC+=o.c;
      return `<tr><td><b>${labFn?labFn(k):k}</b></td><td class="${pnlCls(o.b)}">${pnlTxt(o.b)}</td><td class="${o.c?'neg':'mut'}">${o.c?'−'+kr(o.c):'—'}</td><td class="${pnlCls(o.b-o.c)}" style="font-weight:700">${pnlTxt(o.b-o.c)}</td></tr>`;}).join('');
    return body+`<tr><td style="border-top:2px solid var(--line)"><b>Total</b></td><td style="border-top:2px solid var(--line)" class="${pnlCls(tB)}"><b>${pnlTxt(tB)}</b></td><td style="border-top:2px solid var(--line)" class="neg"><b>${tC?'−'+kr(tC):'—'}</b></td><td style="border-top:2px solid var(--line)" class="${pnlCls(tB-tC)}"><b>${pnlTxt(tB-tC)}</b></td></tr>`;};
  el.innerHTML=`
  <div class="toolbar"><button class="btn ghost" onclick="dlPnl()">⬇ Download full P&L (CSV)</button><span class="mut">every application incl. blocked amounts & refunds — opens in Excel/Sheets</span></div>
  <div class="grid-kpi">
    <div class="kpi"><div class="l">Total invested (allotted)</div><div class="v">${kr(tInv)}</div></div>
    <div class="kpi"><div class="l">Booked profit</div><div class="v ${pnlCls(tBook)}">${pnlTxt(tBook)}</div><div class="s">${tInv?((tBook)/tInv*100).toFixed(1)+'% on invested':''}</div></div>
    <div class="kpi"><div class="l">Open positions value</div><div class="v">${kr(tOpen)}</div><div class="s">unsold allotment shares at CMP</div></div>
    <div class="kpi"><div class="l">Unrealized P&L</div><div class="v ${pnlCls(tUnreal)}">${pnlTxt(tUnreal)}</div></div>
    <div class="kpi"><div class="l">Overall</div><div class="v ${pnlCls(tBook+tUnreal)}">${pnlTxt(tBook+tUnreal)}</div></div>
  </div>
  <div class="card"><h3>📆 Profits — month to month & year to year <small>booked profit minus charges • undated sales count in their listing month</small></h3>
  <div class="two">
    <div><div class="mut" style="font-size:12px;font-weight:700;margin-bottom:6px">MONTH TO MONTH</div>
      <div style="overflow:auto;max-height:340px"><table><thead><tr><th>Month</th><th>Booked</th><th>Charges</th><th>Net</th></tr></thead>
      <tbody>${periodRows(mAgg,mLab)}</tbody></table></div></div>
    <div><div class="mut" style="font-size:12px;font-weight:700;margin-bottom:6px">YEAR TO YEAR — FINANCIAL (APR–MAR) & CALENDAR</div>
      <div style="overflow:auto;max-height:170px;margin-bottom:12px"><table><thead><tr><th>Financial year</th><th>Booked</th><th>Charges</th><th>Net</th></tr></thead>
      <tbody>${periodRows(fyAgg)}</tbody></table></div>
      <div style="overflow:auto;max-height:170px"><table><thead><tr><th>Calendar year</th><th>Booked</th><th>Charges</th><th>Net</th></tr></thead>
      <tbody>${periodRows(cyAgg)}</tbody></table></div></div>
  </div></div>
  <div class="card"><h3>💳 Card &amp; other charges <small>these get deducted from the profit tables above</small></h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input type="month" id="chg-month" style="background:var(--input);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:8px" value="${S.today.slice(0,7)}">
      <input type="number" id="chg-amt" placeholder="₹ amount" min="1" step="0.01" style="width:110px;background:var(--input);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:8px">
      <input id="chg-note" placeholder="note — e.g. HDFC card fee" style="flex:1;min-width:150px;background:var(--input);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:8px">
      <button class="btn sm" onclick="addCharge(false)">Add</button>
      <button class="btn sm ghost" onclick="addCharge(true)" title="Adds this charge EVERY month, starting from the chosen month (fills past missed months too)">↻ Add every month</button>
    </div>
    ${chargeTpls.length?`<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">${chargeTpls.map(t=>`<span class="badge">↻ ${rs(t.amount)}/month • ${esc(t.note||'charge')} <small>(since ${t.since?new Date(+t.since.slice(0,4),+t.since.slice(5,7)-1,1).toLocaleString('en-IN',{month:'short',year:'numeric'}):'?'})</small> <a href="#" onclick="delChargeTpl('${t.id}');return false" title="Stop this monthly charge" style="color:var(--red);text-decoration:none;font-weight:700">✕</a></span>`).join('')}</div>`:''}
    <div style="margin-top:10px">
      ${chargeItems.length?chargeItems.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>`<div style="display:flex;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px solid var(--line);font-size:13px">
        <span style="min-width:74px" class="mut">${x.date?new Date(+x.date.slice(0,4),+x.date.slice(5,7)-1,1).toLocaleString('en-IN',{month:'short',year:'numeric'}):'?'}</span>
        <span class="neg" style="min-width:86px;font-weight:650">−${rs(x.amount)}</span>
        <span style="flex:1">${esc(x.note||'')}${x.tpl?' <span class="mut" style="font-size:11px">↻ auto</span>':''}</span>
        <button class="btn sm danger" onclick="delCharge('${x.id}')" title="Delete this month’s charge">✕</button>
      </div>`).join(''):'<div class="mut" style="font-size:12.5px">No charges recorded yet — add your monthly credit-card charge above (tap ↻ to auto-add it every month).</div>'}
    </div>
  </div>
  <div class="info">💡 On listing day: edit the IPO and set <b>CMP</b> → unrealized P&L updates instantly. When you sell, enter <b>sell qty + avg price</b> in Applications → booked profit locks in.</div>
  <div class="card"><h3>Allotment positions <small>(per account)</small></h3>
  <div style="overflow:auto"><table><thead><tr>
    <th>IPO</th><th>Account</th><th>Allotted</th><th>Cost/sh</th><th>Invested</th><th>CMP</th><th>Sold</th><th>Booked P&L</th><th>Open qty</th><th>Unrealized</th><th>Total</th>
  </tr></thead><tbody>${rowsH||'<tr><td colspan="11" class="mut">No allotments yet — when you win one, it shows up here.</td></tr>'}</tbody></table></div></div>`;
}
window.addCharge=async(repeat)=>{
  const m=document.getElementById('chg-month').value;
  const a=+document.getElementById('chg-amt').value||0;
  const n=document.getElementById('chg-note').value.trim();
  if(!(a>0))return toast('Enter the charge amount',1);
  const r=await api('/api/charges','POST',{amount:a,note:n,month:m||undefined,repeat:!!repeat});
  S.charges=r;renderPnl();
  toast(repeat?'↻ Recurring charge added — it fills every month automatically':'Charge added');
};
window.delCharge=async(id)=>{const r=await api('/api/charges/item/'+encodeURIComponent(id),'DELETE');S.charges=r;renderPnl();toast('Charge deleted');};
window.delChargeTpl=async(id)=>{if(!confirm('Stop this monthly charge from now on? Past months stay as history.'))return;
  const r=await api('/api/charges/tpl/'+encodeURIComponent(id),'DELETE');S.charges=r;renderPnl();toast('↻ Monthly charge stopped — past entries kept');};

// ---------- alerts ----------
let seenAlerts=new Set(JSON.parse(localStorage.getItem('seenAlerts')||'[]'));
let notifOn=localStorage.getItem('notifOn')==='1';
async function loadAlerts(){
  try{
    const r=await api('/api/alerts');
    document.getElementById('alert-ts').textContent='As of '+r.ts+' • auto-refreshes every minute';
    const list=document.getElementById('alert-list');
    const icon={mandate:'💳',refund:'💸',allotment:'🔍',listing:'🔔',listing_soon:'📅',tpin:'🔑'};
    list.innerHTML=(r.alerts.length?r.alerts.map(a=>{
      const key=a.kind+'|'+a.title+'|'+a.detail;
      return `<div class="alert-row sev-${a.sev}">
        <b>${icon[a.kind]||'•'} ${esc(a.title)}</b><br><span class="mut">${esc(a.detail)}</span>
        ${a.ipo_id?`<div style="margin-top:6px"><button class="btn sm ghost" onclick="toggleAlerts();goApps(${a.ipo_id})">Open</button></div>`:''}
      </div>`;}).join(''):'<div class="mut">All clear 🎉 Nothing needs attention.</div>');
    const fresh=r.alerts.filter(a=>!seenAlerts.has(a.kind+'|'+a.title+'|'+a.detail));
    const bc=document.getElementById('bell-count');
    bc.style.display=fresh.length?'block':'none';bc.textContent=fresh.length;
    if(notifOn&&'Notification'in window&&Notification.permission==='granted'){
      fresh.filter(a=>a.sev==='high').forEach(a=>new Notification(a.title,{body:a.detail}));
    }
  }catch(e){}
  updateNotifBtn();
}
function updateNotifBtn(){const b=document.getElementById('notif-btn');if(!b)return;
  b.textContent=notifOn?'🔔 Phone alerts ON':'🔔 Enable phone alerts';
  b.style.color=notifOn?'var(--grn)':'';}
function _b64u8(s){const p='='.repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
window.enableNotifs=async()=>{
  if(!('Notification'in window))return toast('This browser has no notification support',1);
  if(localStorage.getItem('notifOn')==='1'){localStorage.setItem('notifOn','0');notifOn=false;
    toast('Phone alerts off');return updateNotifBtn();}
  if(Notification.permission!=='granted')await Notification.requestPermission();
  if(Notification.permission!=='granted'){toast('Permission denied — allow notifications for this site in Chrome settings',1);return updateNotifBtn();}
  localStorage.setItem('notifOn','1');notifOn=true;
  try{
    const reg=await navigator.serviceWorker.ready;
    const vk=await api('/api/push/vapid');
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:_b64u8(vk.key)});
    await api('/api/push/subscribe','POST',{subscription:sub.toJSON()});
    toast('Phone alerts ON — notifications arrive even when the app is closed ✓');
  }catch(e){toast('Live alerts ON in-app; background push failed: '+e.message,1);}
  updateNotifBtn();};
const NOTIF_CATS=[
 ['allotment','📢 Allotment results','the moment an allotment verdict is found'],
 ['close_today','⏰ Closes today','morning reminder for IPOs closing today'],
 ['mandate','⏳ Mandates pending','evening nag if UPI mandates are unapproved'],
 ['listing','🔔 Listing tomorrow','evening heads-up with your expected position'],
 ['gmp_swing','📈 GMP sharp moves',"≥20% jumps on IPOs you've applied in"],
 ['high_alert','⚠️ Important alerts','data verification divergences & critical checks'],
];
let NP={};
async function loadNotifPrefs(){
  try{NP=await api('/api/notifications/prefs');}catch(e){return;}
  const box=document.getElementById('notif-prefs');if(!box)return;
  box.innerHTML=NOTIF_CATS.map(([k,t,d])=>{
    const on=NP[k]!==false;
    return `<div style="display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px dashed var(--line)">
      <div style="flex:1"><b style="font-size:12.5px">${t}</b><br><span class="mut" style="font-size:10.5px">${d}</span></div>
      <button class="btn sm ${on?'':'ghost'}" style="min-width:56px;${on?'':'color:var(--mut)'}" onclick="prefToggle('${k}')">${on?'ON':'OFF'}</button>
    </div>`;}).join('');
}
window.prefToggle=async(k)=>{
  const want=!(NP[k]!==false);
  try{NP=await api('/api/notifications/prefs','POST',{[k]:want});}catch(e){return toast('Could not save — try again',1);}
  loadNotifPrefs();
  const lbl=(NOTIF_CATS.find(c=>c[0]===k)||[])[1]||k;
  toast(`${lbl.replace(/^[^ ]+ /,'')}: ${NP[k]?'ON ✅':'OFF'}`);};
window.toggleAlerts=()=>{
  const d=document.getElementById('alert-drawer');d.classList.toggle('show');
  if(d.classList.contains('show')){ // mark all seen
    loadNotifPrefs();
    api('/api/alerts').then(r=>{r.alerts.forEach(a=>seenAlerts.add(a.kind+'|'+a.title+'|'+a.detail));
      localStorage.setItem('seenAlerts',JSON.stringify([...seenAlerts].slice(-500)));
      document.getElementById('bell-count').style.display='none';});}};
// polls only run while the app is OPEN & VISIBLE — a closed/minimized app sends
// nothing, so the server's 5-minute session expires and the lock engages.
setInterval(()=>{if(document.visibilityState==='visible')loadAlerts();},60000);setTimeout(loadAlerts,1500);
// heartbeat: every 3 min of real activity holds the auto-lock off; also ping on
// return so an expired session flips to the lock screen immediately (via the
// 401 handler in api()) instead of failing on your next tap.
const heartbeat=()=>{if(document.visibilityState!=='visible')return;
  fetch('/api/ping',{method:'POST'}).then(r=>{if(r.status===401)location.href='/';}).catch(()=>{});};
setInterval(heartbeat,3*60*1000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){heartbeat();loadAlerts();}});

// ---------- modal ----------
function openModal(html){document.getElementById('modal').innerHTML=html;
  document.getElementById('modal-bg').classList.add('show');}
window.closeModal=()=>document.getElementById('modal-bg').classList.remove('show');
document.getElementById('modal-bg').addEventListener('click',e=>{if(e.target.id==='modal-bg')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

refresh().catch(e=>toast('Failed to load: '+e.message,1)).finally(()=>{const b=document.getElementById('boot');if(b){b.classList.add('gone');setTimeout(()=>b.remove(),500);}});
if('serviceWorker'in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
  // auto-reload once when a new service worker takes over (picks up app updates itself)
  let _swReloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(_swReloaded)return;_swReloaded=true;location.reload();});
}
</script>
