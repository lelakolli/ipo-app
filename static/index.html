<!DOCTYPE html>
<html lang="en">
<head>
<script>try{if(localStorage.getItem("ic-theme")==="light")document.documentElement.dataset.theme="light";}catch(_){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/static/icons/icon-512.png">
<link rel="apple-touch-icon" href="/static/icons/icon-512.png">
<title>IPO Command Center</title>
<style>
:root{
  --bg:#0b1220; --card:#121b2e; --card2:#182339; --line:#243150;
  --txt:#e6ecf5; --mut:#8b9bb5; --acc:#4f8cff; --grn:#22c55e; --red:#ef4444;
  --amb:#f59e0b; --prp:#a78bfa;
  --input:var(--input); --hover:var(--hover); --info-bg:#12203a; --info-line:#2c4b8a; --info-txt:#bcd3ff;
}
:root[data-theme=light]{
  --bg:#f1f4f9; --card:#ffffff; --card2:#eef1f6; --line:#d8dee9;
  --txt:#16233a; --mut:#5c6c84; --acc:#2563eb; --grn:#16a34a; --red:#dc2626;
  --amb:#d97706; --prp:#7c3aed;
  --input:#f4f6fa; --hover:#e9eef7; --info-bg:#e7efff; --info-line:#b9cff5; --info-txt:#1e3a66;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px}
header{padding:14px 22px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:50;flex-wrap:wrap}
header h1{font-size:18px;font-weight:650;letter-spacing:.2px}
header h1 span{color:var(--acc)}
.bellbtn{position:relative;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:7px 12px;cursor:pointer;font-size:15px}
.bellbtn:hover{border-color:var(--acc)}
#bell-count{position:absolute;top:-7px;right:-7px;background:var(--red);color:#fff;border-radius:12px;font-size:10.5px;font-weight:700;padding:2px 6px;display:none}
#alert-drawer{position:fixed;top:64px;right:16px;width:380px;max-width:94vw;max-height:72vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:13px;z-index:90;display:none;box-shadow:0 14px 40px rgba(0,0,0,.5);padding:14px}
#alert-drawer.show{display:block}
.alert-row{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;background:var(--card2);font-size:12.5px}
.alert-row b{font-size:13px}
.sev-high{border-left:3px solid var(--red)}.sev-med{border-left:3px solid var(--amb)}.sev-info{border-left:3px solid var(--acc)}
.badge{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--mut)}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{background:none;border:1px solid transparent;color:var(--mut);padding:7px 14px;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:550}
nav button:hover{color:var(--txt)}
nav button.on{background:var(--acc);color:#fff}
main{padding:20px 22px;max-width:1500px;margin:0 auto}
.grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px}
.kpi .l{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.kpi .v{font-size:21px;font-weight:700;margin-top:5px}
.kpi .s{font-size:12px;color:var(--mut);margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:16px}
.card h3{font-size:14.5px;margin-bottom:12px;color:var(--txt)}
.card h3 small{color:var(--mut);font-weight:400}
table{width:100%;border-collapse:collapse}
th{color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:var(--hover)}
input,select,textarea{background:var(--input);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--acc)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc)}
.btn{background:var(--acc);border:none;color:#fff;border-radius:9px;padding:8px 15px;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.12)}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:7px}
.btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--txt)}
.btn.warn{background:var(--amb);color:#111}
.btn.danger{background:transparent;border:1px solid var(--red);color:var(--red)}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:650;white-space:nowrap}
.c-open{background:#123a2a;color:#4ade80}.c-upcoming{background:#1b2a4a;color:#7aa5ff}
.c-result_pending{background:#3a2c12;color:#fbbf24}.c-allotment_done{background:#2a2440;color:#c4b5fd}
.tpill{flex:0 0 auto;display:flex;gap:9px;align-items:center;background:var(--input);border:1px solid var(--line);border-radius:13px;padding:9px 13px;cursor:pointer}.tpill.neg{border-color:#5c2128}
.c-listed{background:#12303f;color:#67e8f9}.c-closed{background:#2a2f3a;color:#9aa7bd}
.pos{color:var(--grn)}.neg{color:var(--red)}.mut{color:var(--mut)}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.modal-bg{position:fixed;inset:0;background:rgba(3,7,18,.72);display:none;z-index:100;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal-bg.show{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:14px;width:560px;max-width:96vw;padding:20px 22px}
.modal h3{margin-bottom:14px;font-size:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 14px}
.form-grid .full{grid-column:1/-1}
.field label{display:block;font-size:11.5px;color:var(--mut);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.field input,.field select,.field textarea{width:100%}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 18px;display:none;z-index:300;font-size:13.5px;max-width:90vw}
.checkres{max-height:280px;overflow:auto;margin-top:10px}
.checkres div{padding:7px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;font-size:12.5px;background:var(--card2)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar select{min-width:280px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.two{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}}
.info{background:var(--info-bg);border:1px solid var(--info-line);border-radius:11px;padding:11px 14px;font-size:12.5px;color:var(--info-txt);margin-bottom:14px;line-height:1.5}
a{color:var(--acc)}
.pbar{height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.pbar div{height:100%;background:var(--acc)}
h2.sec{font-size:15px;margin:22px 0 10px;color:var(--txt)}
select.mini,input.mini{padding:4px 7px;font-size:12px;border-radius:6px}
input.upi-diff{border-color:var(--amb)!important;background:#2a2113!important}
	td.upi-def{white-space:nowrap}
input.num{text-align:right;width:90px}
input.wide{width:150px}
@media(max-width:720px){
  header{padding:10px 12px;gap:6px}
  header h1{font-size:15px}
  .badge{font-size:11px;padding:3px 9px}
  nav{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
  nav button{padding:7px 10px;font-size:12.5px;white-space:nowrap}
  main{padding:12px 10px}
  th,td{font-size:12px;padding:6px 7px}
  .kpi .v{font-size:18px}
  .card{padding:12px}
  .modal{padding:16px;width:100%}
  .form-grid{grid-template-columns:1fr}
  #alert-drawer{top:auto;bottom:0;left:0;right:0;width:100%;max-width:100%;border-radius:14px 14px 0 0;max-height:78vh}
  input.wide{width:112px}
  .toolbar select{min-width:100%}
  .btn{padding:9px 15px}
}
</style>
</head>
<body>
<header>
  <h1>📈 IPO <span>Command Center</span></h1>
  <span class="badge" id="hdr-counts">…</span>
  <button class="bellbtn" id="bell" onclick="toggleAlerts()" title="Alerts & reminders">🔔<span id="bell-count"></span></button>
  <nav>
    <button data-tab="dash" class="on">Dashboard</button>
    <button data-tab="ipos">IPOs</button>
    <button data-tab="market">📊 Market</button>
    <button data-tab="apps">Applications</button>
    <button data-tab="accounts">Accounts</button>
    <button data-tab="pnl">P&amp;L</button>
  </nav>
  <button class="bellbtn themebtn" id="themebtn" onclick="toggleTheme()" title="Switch dark / light">☀️</button>
  <button class="bellbtn" onclick="logout()" title="Log out on this device">⏻</button>
</header>
<main>
  <section id="tab-dash"></section>
  <section id="tab-ipos" style="display:none"></section>
  <section id="tab-market" style="display:none"></section>
  <section id="tab-apps" style="display:none"></section>
  <section id="tab-accounts" style="display:none"></section>
  <section id="tab-pnl" style="display:none"></section>
</main>

<div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>
<div id="alert-drawer">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <b>Alerts & reminders</b>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn sm ghost" id="notif-btn" onclick="enableNotifs()">🔔 Enable phone alerts</button>
      <button class="btn sm ghost" onclick="toggleAlerts()">✕</button>
    </div>
  </div>
  <div class="mut" style="font-size:11px;margin-bottom:8px" id="alert-ts"></div>
  <div id="alert-list"></div>
  <div style="border-top:1px solid var(--line);margin-top:12px;padding-top:10px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b style="font-size:12.5px">🔔 Notification switches</b>
      <span class="mut" style="font-size:10.5px">saved on server • applies to all your devices</span>
    </div>
    <div id="notif-prefs" class="mut" style="font-size:12px;padding-top:6px">loading…</div>
  </div>
</div>
<div id="toast"></div>

<script>
let S={accounts:[],ipos:[],applications:[],today:''};
let applyCheckMode=false;
let curTab='dash', selIpo=null;

// ---------- utils ----------
const api=async(u,m='GET',b)=>{const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
  if(r.status===401){location.href='/';throw new Error('locked');}
  const j=await r.json().catch(()=>({})); if(!r.ok){toast(j.detail||j.error||'Error',1); throw new Error(j.detail||'err');} return j;};
const rs=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:0});
const num=n=>(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const kr=n=>{n=Number(n)||0;if(Math.abs(n)>=1e7)return '₹'+(n/1e7).toFixed(2)+' Cr';if(Math.abs(n)>=1e5)return '₹'+(n/1e5).toFixed(2)+' L';return rs(n);};
const pnlCls=n=>n>0?'pos':(n<0?'neg':'mut');
const pnlTxt=n=>(n>0?'+':'')+kr(n);
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fd=d=>{if(!d)return'—';const[y,m,dd]=d.split('-');return `${+dd} ${MONTHS[+m-1]}`;};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastTm=null;
function toast(msg,bad){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';
  t.style.borderColor=bad?'var(--red)':'var(--grn)';clearTimeout(toastTm);toastTm=setTimeout(()=>t.style.display='none',3200);}
const ipoById=id=>S.ipos.find(x=>x.id===+id);
const accById=id=>S.accounts.find(x=>x.id===+id);
const appFor=(ipo,acc)=>S.applications.find(a=>a.ipo_id===+ipo&&a.account_id===+acc);
const costPerShare=a=>a.allotted_qty>0?a.amount/a.allotted_qty:0;
const bookedPnl=a=>a.allotment==='allotted'&&a.sell_qty>0?(a.sell_price-costPerShare(a))*a.sell_qty:0;
const unrealPnl=(a,ipo)=>a.allotment==='allotted'?( (ipo.cmp||0)-costPerShare(a) )*Math.max(0,a.allotted_qty-a.sell_qty):0;

async function refresh(){S=await api('/api/state');
  document.getElementById('hdr-counts').textContent=`${S.accounts.filter(a=>a.active).length} accounts • ${S.ipos.filter(i=>i.status==='open').length} IPOs open`;
  render();}

// ---------- tabs ----------
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{curTab=b.dataset.tab;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('main section').forEach(s=>s.style.display='none');
  document.getElementById('tab-'+curTab).style.display='block';render();});

function render(){
  ({dash:renderDash,ipos:renderIpos,market:renderMarket,apps:renderApps,accounts:renderAccounts,pnl:renderPnl})[curTab]();
}

// ---------- MARKET (self-verifying GMP / subscription intelligence) ----------
let MKT=null, mktSub='gmp', mktSnap=null, mktSnapId=null;
const stateDot=st=>({verified:'🟢',single:'🟡',diverged:'🔴',kept:'🟡',none:'⚪'}[st]||'⚪');
const stateTxt=st=>({verified:'2 sources agree',single:'1 source',diverged:'sources differ — showing freshest',kept:'kept last verified value'}[st]||'no data');
const fmtX=n=>n==null?'—':num(n)+'×';
async function loadMkt(force){if(MKT&&!force)return;
  try{MKT=await api('/api/market');}catch(e){toast('Market data load failed',1);}}
function renderMarket(){
  const el=document.getElementById('tab-market');
  el.innerHTML=`<div class="mut" style="padding:30px;text-align:center">Loading market boards…</div>`;
  loadMkt(false).then(()=>{if(curTab==='market')drawMarket();});
}
window.drawMarket=()=>{
  const el=document.getElementById('tab-market');
  if(!MKT){el.innerHTML='<div class="card mut">Market engine has not produced data yet — it warms up within a minute of server start.</div>';return;}
  const g=(MKT.gmp_board&&MKT.gmp_board.rows)||[], sub=(MKT.sub_board&&MKT.sub_board.rows)||[];
  const tr=MKT.tracked||{};
  const ver=MKT.verify||{}, ls=MKT.last_summary||{};
  el.innerHTML=`
  <div class="toolbar" style="align-items:center">
    ${[['gmp','💹 GMP board'],['sub','🧾 Subscription'],['ipo','🔎 Per-IPO'],['qc','✔ Verification']].map(([k,l])=>
      `<button class="btn sm ${mktSub===k?'':'ghost'}" onclick="mktSub='${k}';drawMarket()">${l}</button>`).join('')}
    <span style="flex:1"></span>
    <button class="btn sm ghost" id="mktbtn" onclick="mktRefresh(this)">↻ Refresh now</button>
  </div>
  <div class="mut" style="font-size:11.5px;margin-bottom:8px">
    Updated: ${esc(MKT.last_refresh||'—')}${MKT.gmp_board&&MKT.gmp_board.at?` • board ${esc(MKT.gmp_board.at)}`:''}
    &nbsp;|&nbsp; ${stateDot('verified')} 2 sources agree &nbsp;${stateDot('single')} 1 source &nbsp;${stateDot('diverged')} sources differ &nbsp;•&nbsp; a number that fails the double-check is <b>not</b> shown — the last verified value stays.
  </div>
  ${mktSub==='gmp'?`<div class="card"><h3>💹 GMP board <small>— grey market premium & expected listing</small></h3>
    <div style="overflow-x:auto"><table><thead><tr><th style="text-align:left">IPO</th><th>GMP ₹</th><th>Trend</th><th>Est listing ₹</th><th>Gain %</th><th>Dates</th><th>Type</th><th>Status</th><th>Source ts</th></tr></thead><tbody>
    ${g.map(r=>`<tr><td style="text-align:left"><b>${esc(r.name)}</b></td><td>${r.gmp!=null?num(r.gmp):'—'}</td><td>${esc(r.trend||'')}</td>
      <td>${r.est_listing!=null?num(r.est_listing):'—'}</td><td class="${(r.est_pct||0)>0?'pos':'mut'}">${r.est_pct!=null?num(r.est_pct)+'%':'—'}</td>
      <td class="mut">${esc(r.dates_txt||'')}</td><td class="mut">${esc(r.board||'')}</td><td>${esc(r.status||'')}</td><td class="mut">${esc(r.updated||'')}</td></tr>`).join('')||'<tr><td colspan="9" class="mut">no board data yet</td></tr>'}
    </tbody></table></div>
    <div class="mut" style="font-size:11.5px;margin-top:6px">Kostak &amp; Subject-to-Sauda are published by grey-market trackers (InvestorGain) only for hot issues — see the Per-IPO view; when unpublished the app shows —.</div>
    </div>`:''}
  ${mktSub==='sub'?`<div class="card"><h3>🧾 Live subscription board <small>— times subscribed</small></h3>
    <div style="overflow-x:auto"><table><thead><tr><th style="text-align:left">IPO</th><th>QIB</th><th>NII</th><th>Retail</th><th>Total</th><th>Closes</th><th>Type</th><th>Source ts</th></tr></thead><tbody>
    ${sub.map(r=>`<tr><td style="text-align:left"><b>${esc(r.name)}</b></td><td>${fmtX(r.qib)}</td><td>${fmtX(r.nii)}</td><td>${fmtX(r.rii)}</td><td><b>${fmtX(r.total)}</b></td><td class="mut">${esc(r.close_txt||'')}</td><td class="mut">${esc(r.board||'')}</td><td class="mut">${esc(r.updated||'')}</td></tr>`).join('')||'<tr><td colspan="8" class="mut">no board data yet</td></tr>'}
    </tbody></table></div>
    <div class="mut" style="font-size:11.5px;margin-top:6px">sHNI/bHNI split comes from the IPO Ji feed — see the Per-IPO view for the full break-up.</div>
    </div>`:''}
  ${mktSub==='ipo'?`<div class="card"><h3>🔎 Per-IPO numbers</h3>
    <select id="mkt-pick" class="wide" style="max-width:100%;padding:9px;border-radius:9px;background:var(--input);color:var(--txt);border:1px solid var(--line)" onchange="mktSnapId=this.value;mktSnap=null;drawIpoSnap()">
      <option value="">— pick an IPO —</option>
      ${S.ipos.map(i=>`<option value="${i.id}" ${+mktSnapId===i.id?'selected':''}>${esc(i.name)}</option>`).join('')}
    </select>
    <div id="mkt-snap" style="margin-top:10px">${mktSnap?mktSnap:''}</div></div>`:''}
  ${mktSub==='qc'?`<div class="card"><h3>✔ Daily verification report</h3>
    <div class="mut" style="font-size:12.5px;line-height:1.7">
    Last deep check: <b>${esc(ver.at||'not run yet today')}</b><br>
    ${Object.entries(ver).filter(([k])=>k!=='at').map(([k,v])=>`<b>${esc(k)}</b>: ${esc(Array.isArray(v)?(v.join(' • ')||'none'):String(v))}<br>`).join('')||'—'}
    </div>
    <h3 style="margin-top:14px">👁 Watch-list (auto-detects new IPOs)</h3>
    ${(MKT.watch||[]).map(w=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b>${esc(w.label)}</b> — ${w.found?`<span class="pos">PUBLISHED as “${esc(w.found.name)}” (${esc(w.found.at)})</span>`:'<span class="amb">not published by sources yet — the engine checks every 30 min and adds it automatically the moment it appears</span>'}</div>`).join('')||'<div class="mut">nothing watched</div>'}
    <div class="mut" style="font-size:11.5px;margin-top:10px">If all three sources go down at once, the last verified numbers stay on screen with their timestamps — nothing silently turns to 0.</div>
    <button class="btn sm ghost" style="margin-top:10px" onclick="api('/api/market/verify').then(()=>{toast('Verification started — updating in ~45s…');setTimeout(()=>loadMkt(false).then(()=>{if(curTab==='market')drawMarket();}),45000);})">Run deep verification now</button>
  </div>`:''}`;
  if(mktSub==='ipo'&&mktSnapId&&!mktSnap)drawIpoSnap();
};
window.mktRefresh=async(b)=>{b.disabled=true;b.textContent='Refreshing…';
  try{const r=await api('/api/market/refresh','POST');
    toast(`Market refresh: ${r.matched} IPO(s) matched, ${r.verified} fully verified${r.unstable?.length?`, ${r.unstable.length} unstable rows kept old values`:''}`);
  }catch(e){} MKT=null;b.disabled=false;b.textContent='↻ Refresh now';drawMarket();};
window.drawIpoSnap=async()=>{
  const box=document.getElementById('mkt-snap');if(!box)return;
  box.innerHTML='<div class="mut">loading…</div>';
  let j;try{j=await api('/api/market/ipo/'+mktSnapId);}catch(e){box.innerHTML='<div class="neg">failed</div>';return;}
  if(!j.ok){box.innerHTML='<div class="neg">not found</div>';return;}
  const p=j.ipo,m=j.market||{},s=(m.sub)||j.legacy_sub||{};

function renderDash(){

  const mandPend=apps.filter(a=>a.mandate_status==='pending');

    const sh=S.applications.filter(a=>a.ipo_id===i.id&&a.allotment==='allotted').reduce((s,a)=>s+(a.allotted_qty||0),0);
    pills.push({ic:'🔔',t:`<b>${esc(i.name)}</b> lists today`,s:sh?`${sh} sh held${i.cmp?` • CMP ₹${num(i.cmp)}`:''}`:(i.gmp?`last GMP ₹${num(i.gmp)}`:''),act:`goApps(${i.id})`});});

  el.innerHTML=`
  <div class="info">💡 Allotment is <b>PAN-based</b> — keep one unique PAN per account or exchanges reject duplicate bids. This app never asks for your demat/broker passwords; allotment checks use only PAN / CDSL BO ID (public registrar data).</div>
  ${todayStrip}
  <div class="grid-kpi">
    <div class="kpi"><div class="l">IPOs open now</div><div class="v">${openIpos.length}</div><div class="s">${S.ipos.filter(i=>i.status==='upcoming').length} upcoming</div></div>
    <div class="kpi"><div class="l">Capital blocked</div><div class="v">${kr(blocked)}</div><div class="s">mandates approved, results awaited</div></div>
    <div class="kpi"><div class="l">Refunds pending</div><div class="v" style="color:var(--amb)">${kr(awaitingRefund)}</div><div class="s">not allotted, unblock awaited</div></div>
    <div class="kpi"><div class="l">Mandates to approve</div><div class="v" style="color:${mandPend.length?'var(--red)':'var(--grn)'}">${mandPend.length}</div><div class="s">UPI requests waiting</div></div>
    <div class="kpi"><div class="l">Booked profit</div><div class="v ${pnlCls(booked)}">${pnlTxt(booked)}</div><div class="s">from sold allotments</div></div>
    <div class="kpi"><div class="l">Unrealized P&L</div><div class="v ${pnlCls(unreal)}">${pnlTxt(unreal)}</div><div class="s">open allotment positions at CMP</div></div>
  </div>
  <div class="two">
    <div class="card"><h3>⚡ Needs your action <small>(${acts.length})</small></h3>
      ${acts.length?acts.map(a=>`<div style="padding:7px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center">
        <div><span class="${a.cls||''}" style="font-weight:600">${a.t}</span><br><span class="mut">${a.d}</span></div>
        ${a.act?`<button class="btn sm ghost" onclick="${a.act}">Open</button>`:''}</div>`).join('')
      :'<div class="mut">All clear 🎉</div>'}
    </div>
    <div class="card"><h3>🟢 Open / upcoming mainboard IPOs</h3>
      ${S.ipos.filter(i=>['open','upcoming'].includes(i.status)&&i.board==='Mainboard').map(i=>`

    </div>
  </div>
  ${S.mobile&&S.mobile.url?`

    <h3>📱 Mobile link <small>— scan with your phone camera anytime the phone app stops responding</small></h3>

      <input id="pc-new" inputmode="numeric" maxlength="6" placeholder="new 6-digit" style="width:130px;background:var(--input);border:1px solid var(--line);border-radius:9px;padding:9px;color:var(--txt)">

    </div>

window.restoreBackup=async(inp)=>{
  const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  if(!confirm('Restore this backup? It REPLACES all data currently in the app.'))return;
  let j;try{j=JSON.parse(await f.text());}catch(e){alert('That file is not a valid backup.');return;}
  try{
    const r=await fetch('/api/backup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(j)});
    const d=await r.json();
    if(r.ok&&d.ok){alert('✅ Restored: '+d.counts.accounts+' accounts, '+d.counts.ipos+' IPOs, '+d.counts.applications+' applications');location.reload();}
    else alert('Restore failed: '+(d.detail||d.error||('HTTP '+r.status)));
  }catch(e){alert('Restore failed: '+e.message);}
};
window.changePass=async()=>{
  const cur=document.getElementById('pc-cur').value.trim(),nw=document.getElementById('pc-new').value.trim();
  if(!/^\d{6}$/.test(cur)||!/^\d{6}$/.test(nw))return toast('Both must be 6-digit numbers',1);
  await api('/api/passcode','POST',{current:cur,new:nw});
  toast('✅ Passcode changed — saved permanently');
  document.getElementById('pc-cur').value='';document.getElementById('pc-new').value='';};
window.goApps=(id,check)=>{selIpo=id;curTab='apps';

  if(check)setTimeout(()=>runAllotmentCheck(),200);};

const STATUS_LABEL={open:'OPEN',upcoming:'UPCOMING',result_pending:'RESULT AWAITED',allotment_done:'ALLOTMENT DONE',listed:'LISTED'};

async function collectRow(tr){
  const gv=c=>tr.querySelector(c).value;
  const gc=c=>tr.querySelector(c).checked;
  return {ipo_id:selIpo,account_id:+tr.dataset.acc,applied:gc('.f-applied')?1:0,
    lots:+gv('.f-lots')||0,amount:+gv('.f-amount')||0,upi:gv('.f-upi'),app_no:gv('.f-appno'),
    mandate_status:gv('.f-mandate'),allotment:gv('.f-allot'),allotted_qty:+gv('.f-aqty')||0,
    refund:gv('.f-refund'),sell_qty:+gv('.f-sqty')||0,sell_price:+gv('.f-sprice')||0};
}
async function saveRow(tr){
  const b=await collectRow(tr);
  // if amount empty & applied → let server auto-compute from lots
  if(!b.amount)delete b.amount;
  await api('/api/applications','POST',b);
  S=await api('/api/state');
  // lightly update row styling without full re-render jump
  if(b.applied&&!tr.querySelector('.f-lots').value)tr.querySelector('.f-lots').value=1;
  tr.querySelectorAll('input,select').forEach(x=>{if(!x.classList.contains('f-applied'))x.disabled=!b.applied;});
  const upiInp=tr.querySelector('.f-upi');
  if(upiInp)upiInp.classList.toggle('upi-diff',!!(upiInp.dataset.def&&upiInp.value.trim()&&upiInp.value.trim()!==upiInp.dataset.def));
  const ap=appFor(selIpo,b.account_id)||{},ipo=ipoById(selIpo);
  const profit=bookedPnl(ap)+unrealPnl(ap,ipo);
  const cell=tr.querySelector('.f-pnl');
  cell.className=pnlCls(profit);
  cell.innerHTML=ap.allotment==='allotted'?pnlTxt(profit):'<span class="mut">—</span>';
  toast('Saved');
}
window.copyDefUpi=btn=>{
  const tr=btn.closest('tr');

};

window.dlPnl=async()=>{

window.markAllMandates=async()=>{

window.unblockAllFunds=async()=>{
  const ipo=ipoById(selIpo);if(!ipo)return;

    const r=await api(`/api/ipos/${ipo.id}/funds_unblocked`,'POST',{});

window.checkOne=async(accId)=>{
  const ap=appFor(selIpo,accId);
  const body={ipo_id:selIpo,account_id:accId,category:'Retail'};
  if(ap&&ap.applied)body.applied=0;
  else{body.applied=1;body.lots=1;}

window.soldAllCmp=async()=>{
  const ipo=ipoById(selIpo);if(!ipo)return;
  if(!(ipo.cmp>0))return toast('CMP not set for this IPO yet — tap ↻ CMP on the IPOs tab first',1);
  const n=S.applications.filter(a=>a.ipo_id===ipo.id&&a.allotment==='allotted'&&(a.allotted_qty-(a.sell_qty||0))>0).length;
  if(!n)return toast('Nothing left to sell — every allotted row is already fully sold ✓');
  if(!confirm(`Book ALL ${n} allotted row${n===1?'':'s'} of "${ipo.name}" as SOLD at CMP ₹${num(ipo.cmp)} each?`))return;
  const r=await api(`/api/ipos/${ipo.id}/sold_all`,'POST',{});
  toast(`💰 ${r.sold_rows} rows sold @ ₹${num(r.price)} — P&L locked ✓`);refresh();};
window.soldAllPrice=async()=>{
  const ipo=ipoById(selIpo);if(!ipo)return;
  const p=prompt(`Sell price per share for ALL allotted rows of "${ipo.name}"?`,ipo.cmp||'');
  if(!p||isNaN(+p)||+p<=0)return;
  const r=await api(`/api/ipos/${ipo.id}/sold_all`,'POST',{price:+p});
  toast(`💰 ${r.sold_rows} rows sold @ ₹${num(r.price)} — P&L locked ✓`);refresh();};
window.runAllotmentCheck=async()=>{
  const btn=document.getElementById('chkbtn');btn.disabled=true;btn.textContent='Checking…';
  const box=document.getElementById('checkres');box.style.display='block';
  box.innerHTML='<div class="mut">Querying '+esc(ipoById(selIpo).registrar)+' for every account… (5–20 sec)</div>';
  try{
    const r=await api(`/api/ipos/${selIpo}/check_allotment`,'POST');
    box.innerHTML=r.results.map(x=>{
      const col=x.status==='ok'?'var(--grn)':(x.status==='not_found'?'var(--amb)':'var(--mut)');
      const lbl=x.status==='ok'?`✅ Allotted ${x.allotted_qty||''} sh`:(x.status==='not_found'?'❌ No allotment record':(x.status==='manual'?'🖐 Check manually':'⚠ '+x.status));
      return `<div><b>${esc(x.holder)}</b> — <span style="color:${col};font-weight:650">${lbl}</span>
        ${x.note?`<br><span class="mut">${esc(x.note)}</span>`:''}
        ${x.matched_company?`<br><span class="mut">matched: ${esc(x.matched_company)}</span>`:''}
        ${x.link?`<br><a href="${x.link}" target="_blank">Open registrar →</a>`:''}</div>`;}).join('');
    toast('Allotment check complete');
  }catch(e){box.innerHTML='<div class="neg">Check failed: '+esc(e.message)+'</div>';}
  btn.disabled=false;btn.textContent='🔍 Auto-check allotment ('+ipoById(selIpo).registrar+')';
  refresh();};

// ---------- P&L ----------
function renderPnl(){
  const el=document.getElementById('tab-pnl');
  const apps=S.applications.filter(a=>a.applied&&a.allotment==='allotted');
  let tInv=0,tBook=0,tOpen=0,tUnreal=0;
  const rowsH=apps.map(a=>{
    const ipo=ipoById(a.ipo_id)||{},acc=accById(a.account_id)||{};
    const cost=costPerShare(a),inv=a.amount,book=bookedPnl(a),unrl=unrealPnl(a,ipo);
    const openQty=Math.max(0,a.allotted_qty-a.sell_qty),openVal=openQty*(ipo.cmp||0);
    tInv+=inv;tBook+=book;tOpen+=openVal;tUnreal+=unrl;
    return `<tr>
    <td><b>${esc(ipo.name||'?')}</b><br><span class="mut" style="font-size:11px">${fd(ipo.listing_date)}${ipo.symbol?' • '+esc(ipo.symbol):''}</span></td>
    <td>${esc(acc.holder||'?')}</td>
    <td>${num(a.allotted_qty)}</td><td>₹${num(cost)}</td><td>${rs(inv)}</td>
    <td>${ipo.cmp?'₹'+num(ipo.cmp):'<span class="mut">set CMP</span>'}</td>
    <td>${a.sell_qty?num(a.sell_qty)+' @ ₹'+num(a.sell_price):'—'}</td>
    <td class="${pnlCls(book)}">${a.sell_qty?pnlTxt(book):'—'}</td>
    <td>${openQty?num(openQty)+' sh ('+kr(openVal)+')':'—'}</td>
    <td class="${pnlCls(unrl)}">${openQty?(ipo.cmp?pnlTxt(unrl):'<span class="mut">set CMP</span>'):'—'}</td>
    <td class="${pnlCls(book+unrl)}" style="font-weight:700">${pnlTxt(book+unrl)}</td>
    </tr>`;}).join('');
  el.innerHTML=`
  <div class="toolbar"><button class="btn ghost" onclick="dlPnl()">⬇ Download full P&L (CSV)</button><span class="mut">every application incl. blocked amounts & refunds — opens in Excel/Sheets</span></div>
  <div class="grid-kpi">
    <div class="kpi"><div class="l">Total invested (allotted)</div><div class="v">${kr(tInv)}</div></div>
    <div class="kpi"><div class="l">Booked profit</div><div class="v ${pnlCls(tBook)}">${pnlTxt(tBook)}</div><div class="s">${tInv?((tBook)/tInv*100).toFixed(1)+'% on invested':''}</div></div>
    <div class="kpi"><div class="l">Open positions value</div><div class="v">${kr(tOpen)}</div><div class="s">unsold allotment shares at CMP</div></div>
    <div class="kpi"><div class="l">Unrealized P&L</div><div class="v ${pnlCls(tUnreal)}">${pnlTxt(tUnreal)}</div></div>
    <div class="kpi"><div class="l">Overall</div><div class="v ${pnlCls(tBook+tUnreal)}">${pnlTxt(tBook+tUnreal)}</div></div>
  </div>
  <div class="info">💡 On listing day: edit the IPO and set <b>CMP</b> → unrealized P&L updates instantly. When you sell, enter <b>sell qty + avg price</b> in Applications → booked profit locks in.</div>
  <div class="card"><h3>Allotment positions <small>(per account)</small></h3>
  <div style="overflow:auto"><table><thead><tr>
    <th>IPO</th><th>Account</th><th>Allotted</th><th>Cost/sh</th><th>Invested</th><th>CMP</th><th>Sold</th><th>Booked P&L</th><th>Open qty</th><th>Unrealized</th><th>Total</th>
  </tr></thead><tbody>${rowsH||'<tr><td colspan="11" class="mut">No allotments yet — when you win one, it shows up here.</td></tr>'}</tbody></table></div></div>`;
}

// ---------- alerts ----------
let seenAlerts=new Set(JSON.parse(localStorage.getItem('seenAlerts')||'[]'));
let notifOn=localStorage.getItem('notifOn')==='1';
async function loadAlerts(){
  try{
    const r=await api('/api/alerts');
    document.getElementById('alert-ts').textContent='As of '+r.ts+' • auto-refreshes every minute';
    const list=document.getElementById('alert-list');
    const icon={mandate:'💳',refund:'💸',allotment:'🔍',listing:'🔔',listing_soon:'📅',tpin:'🔑'};
    list.innerHTML=(r.alerts.length?r.alerts.map(a=>{
      const key=a.kind+'|'+a.title+'|'+a.detail;
      return `<div class="alert-row sev-${a.sev}">
        <b>${icon[a.kind]||'•'} ${esc(a.title)}</b><br><span class="mut">${esc(a.detail)}</span>
        ${a.ipo_id?`<div style="margin-top:6px"><button class="btn sm ghost" onclick="toggleAlerts();goApps(${a.ipo_id})">Open</button></div>`:''}
      </div>`;}).join(''):'<div class="mut">All clear 🎉 Nothing needs attention.</div>');
    const fresh=r.alerts.filter(a=>!seenAlerts.has(a.kind+'|'+a.title+'|'+a.detail));
    const bc=document.getElementById('bell-count');
    bc.style.display=fresh.length?'block':'none';bc.textContent=fresh.length;
    if(notifOn&&'Notification'in window&&Notification.permission==='granted'){
      fresh.filter(a=>a.sev==='high').forEach(a=>new Notification(a.title,{body:a.detail}));
    }
  }catch(e){}
  updateNotifBtn();
}
function updateNotifBtn(){const b=document.getElementById('notif-btn');if(!b)return;
  b.textContent=notifOn?'🔔 Phone alerts ON':'🔔 Enable phone alerts';
  b.style.color=notifOn?'var(--grn)':'';}
function _b64u8(s){const p='='.repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
window.enableNotifs=async()=>{
  if(!('Notification'in window))return toast('This browser has no notification support',1);
  if(localStorage.getItem('notifOn')==='1'){localStorage.setItem('notifOn','0');notifOn=false;
    toast('Phone alerts off');return updateNotifBtn();}
  if(Notification.permission!=='granted')await Notification.requestPermission();
  if(Notification.permission!=='granted'){toast('Permission denied — allow notifications for this site in Chrome settings',1);return updateNotifBtn();}
  localStorage.setItem('notifOn','1');notifOn=true;
  try{
    const reg=await navigator.serviceWorker.ready;
    const vk=await api('/api/push/vapid');
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:_b64u8(vk.key)});
    await api('/api/push/subscribe','POST',{subscription:sub.toJSON()});
    toast('Phone alerts ON — notifications arrive even when the app is closed ✓');
  }catch(e){toast('Live alerts ON in-app; background push failed: '+e.message,1);}
  updateNotifBtn();};
const NOTIF_CATS=[
 ['allotment','📢 Allotment results','the moment an allotment verdict is found'],
 ['close_today','⏰ Closes today','morning reminder for IPOs closing today'],
 ['mandate','⏳ Mandates pending','evening nag if UPI mandates are unapproved'],
 ['listing','🔔 Listing tomorrow','evening heads-up with your expected position'],
 ['gmp_swing','📈 GMP sharp moves',"≥20% jumps on IPOs you've applied in"],
 ['high_alert','⚠️ Important alerts','data verification divergences & critical checks'],
];
let NP={};
async function loadNotifPrefs(){
  try{NP=await api('/api/notifications/prefs');}catch(e){return;}
  const box=document.getElementById('notif-prefs');if(!box)return;
  box.innerHTML=NOTIF_CATS.map(([k,t,d])=>{
    const on=NP[k]!==false;
    return `<div style="display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px dashed var(--line)">
      <div style="flex:1"><b style="font-size:12.5px">${t}</b><br><span class="mut" style="font-size:10.5px">${d}</span></div>
      <button class="btn sm ${on?'':'ghost'}" style="min-width:56px;${on?'':'color:var(--mut)'}" onclick="prefToggle('${k}')">${on?'ON':'OFF'}</button>
    </div>`;}).join('');
}
window.prefToggle=async(k)=>{
  const want=!(NP[k]!==false);
  try{NP=await api('/api/notifications/prefs','POST',{[k]:want});}catch(e){return toast('Could not save — try again',1);}
  loadNotifPrefs();
  const lbl=(NOTIF_CATS.find(c=>c[0]===k)||[])[1]||k;
  toast(`${lbl.replace(/^[^ ]+ /,'')}: ${NP[k]?'ON ✅':'OFF'}`);};
window.toggleAlerts=()=>{
  const d=document.getElementById('alert-drawer');d.classList.toggle('show');
  if(d.classList.contains('show')){ // mark all seen
    loadNotifPrefs();
    api('/api/alerts').then(r=>{r.alerts.forEach(a=>seenAlerts.add(a.kind+'|'+a.title+'|'+a.detail));
      localStorage.setItem('seenAlerts',JSON.stringify([...seenAlerts].slice(-500)));
      document.getElementById('bell-count').style.display='none';});}};
setInterval(loadAlerts,60000);setTimeout(loadAlerts,1500);

// ---------- modal ----------
function openModal(html){document.getElementById('modal').innerHTML=html;
  document.getElementById('modal-bg').classList.add('show');}
window.closeModal=()=>document.getElementById('modal-bg').classList.remove('show');
document.getElementById('modal-bg').addEventListener('click',e=>{if(e.target.id==='modal-bg')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

refresh().catch(e=>toast('Failed to load: '+e.message,1));
if('serviceWorker'in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
  // auto-reload once when a new service worker takes over (picks up app updates itself)
  let _swReloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(_swReloaded)return;_swReloaded=true;location.reload();});
}
